<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fouché Motors | Supercars, luxury SUVs and collector cars in Sandton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
/* Layout: one-page dealer microsite; full-bleed card rails per stock section; vehicle popup = Polestar-style two-column takeover (pinned gallery left, scrolling detail right) */
:root{
  color-scheme:light;
  --bg:#f3f4f7;          /* page ground, cool grey tied to accent */
  --surface:#ffffff;
  --ink:#121419;
  --muted:#5c6371;
  --faint:#8a909c;
  --line:#e1e4ea;
  --line-strong:#c8cdd7;
  --accent:#3d5ae0;      /* brand accent: set per build */
  --accent-ink:#ffffff;
  --accent-soft:color-mix(in srgb, var(--accent) 9%, #ffffff);
  --ok:#1d7f48; --ok-soft:#e7f5ec;
  --err:#b42318;
  --scrim:rgba(14,16,21,.56);
  --banner:#0b0b0c;
  --font:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-card:16px; --r-ctl:10px;
  --gap:20px;
  --cw:min(1240px, calc(100vw - 32px));
  --pad:max(16px, calc((100vw - 1240px) / 2));
  --gutter:clamp(16px, 2.5vw, 48px);   /* page edge gap: header, section titles and slides start here (left aligned, not centred) */
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- site header ---------- */
.mock-note{background:var(--accent-soft);color:var(--ink);font-size:13px;padding:8px var(--gutter);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.mock-note b{font-weight:600}
.plc-btn{font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;border:0}
.plc-btn.bad{background:#b42318;color:#fff;cursor:pointer}
.plc-btn.ok{background:var(--ok-soft);color:var(--ok)}
.plc{position:fixed;top:12px;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);display:flex;flex-direction:column}
.plc-h{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.plc-h b{font-size:16px}.plc-h span{grid-column:1;font-size:13px;color:var(--muted)}.plc-h .x-btn{grid-row:1/3;grid-column:2}
.plc-b{overflow:auto;padding:6px 18px 18px}
.plc-b h4{font-size:13px;margin:16px 0 6px;display:flex;justify-content:space-between}
.plc-b h4 i{font-style:normal;color:#b42318}
.plc-b ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
/* optional hide-on-scroll (driven by settings.header.hideOnScroll) */
.site-head{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.site-head.is-hidden{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 1px))}
.stock{scroll-margin-top:72px}
.site-head .in{margin:0 var(--gutter);display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--ink)}
.brand b{font-size:17px;letter-spacing:.14em;font-weight:700}
.brand{flex:none}
.brand span{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:4px;text-transform:uppercase;white-space:nowrap}
@media (max-width:520px){.brand span{display:none}.site-nav a{padding:8px 9px;font-size:13px}}
.site-nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.site-nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap}
.site-nav a:hover{background:var(--bg)}
.head-call{font-size:14px;font-weight:600;white-space:nowrap}
@media (max-width:720px){.head-call{display:none}.site-head .in{gap:12px}}

/* ---------- stock sections ---------- */
main{padding-block:28px 64px}
.stock{padding-block:28px 12px}
.stock-head{margin:0 var(--gutter) 18px;display:flex;align-items:flex-end;gap:16px;justify-content:space-between}
/* vehicle count on its own line under the intro (no pre-headings above titles) */
.stock-head .count{display:block;margin-top:6px;font-size:13px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.stock-head h2{font-size:clamp(24px,3.2vw,34px);line-height:1.1;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.stock-head p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.rail-ctl{display:flex;gap:8px;flex:none}
.rail-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;transition:opacity .2s}
.rail-btn:disabled{opacity:.35;cursor:default}
.rail-btn svg{width:18px;height:18px}
@media (max-width:720px){.rail-ctl{display:none}}

/* free-scrolling rail: no snap points, native momentum on touch/trackpad, JS inertia for mouse drag */
.rail{display:flex;gap:var(--gap);overflow-x:auto;overflow-y:hidden;padding:4px var(--gutter) 18px;scroll-padding-inline:var(--gutter);scroll-snap-type:none;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail.dragging{cursor:grabbing;user-select:none}
.rail.dragging .card{pointer-events:none}
.rail > *{flex:0 0 calc((var(--cw) - 3 * var(--gap)) / 3.15)}   /* ~3 cards + a peek: wide enough for 3 stats in a row */
@media (max-width:1240px){.rail > *{flex-basis:calc((var(--cw) - 2 * var(--gap)) / 2.7)}}
@media (max-width:1080px){.rail > *{flex-basis:calc((var(--cw) - var(--gap)) / 2.3)}}
@media (max-width:720px){:root{--gap:12px}.rail > *{flex-basis:calc((100vw - 16px) / 1.15 - var(--gap))}}

/* ---------- vehicle card (Sean's design) ---------- */
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;cursor:pointer;transition:box-shadow .25s,border-color .25s}
.card:hover{border-color:var(--line-strong);box-shadow:0 10px 30px -18px rgba(18,20,25,.35)}
.cm{position:relative;aspect-ratio:4/3;background:#fff;overflow:hidden}
.cm-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.cm-track::-webkit-scrollbar{display:none}
.cm-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block;-webkit-user-drag:none;user-select:none}
.cm::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff);pointer-events:none}
.cm-arrow{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border:0;border-radius:50%;background:rgba(98,104,116,.62);color:#fff;display:grid;align-items:center;z-index:2;transition:background .2s}
.cm-arrow:hover{background:rgba(60,64,72,.82)}
.cm-arrow svg{width:16px;height:16px}
.cm-arrow.prev{left:-22px;justify-items:end;padding-right:6px}
.cm-arrow.next{right:-22px;justify-items:start;padding-left:6px}
.cm-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;z-index:2}
.cm-dots i{width:6px;height:6px;border-radius:50%;background:rgba(18,20,25,.22);transition:background .2s,width .2s}
.cm-dots i.on{background:var(--ink);width:16px;border-radius:3px}
.cmp{position:absolute;top:10px;right:10px;z-index:3;height:34px;padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.92);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.cmp svg{width:16px;height:16px}
.cmp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cb{display:flex;flex-direction:column;flex:1;padding:18px 22px 22px}
.c-title{font-size:20px;line-height:1.25;font-weight:700;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(2 * 1.25em);letter-spacing:-.005em}
.c-sub{font-size:17px;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-extra{font-size:13px;color:var(--muted);margin:6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em}
.c-extra:empty{visibility:hidden}
.no-extra .c-extra{display:none}
.chips{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips li{border:1px solid var(--accent);border-radius:8px;padding:7px 4px;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{margin:18px 0 0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:auto;padding-top:18px}
.stats.n3{grid-auto-columns:auto}   /* 3 columns size to their content, so long and short values share the row fairly */
.stats > div{padding:0 10px;border-left:1px solid var(--line-strong);min-width:0}
.stats > div:first-child{padding-left:0;border-left:0}
.stats dt{font-size:12.5px;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:4px}
.stats dd{margin:2px 0 0;font-size:19px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.stats.n1 dd{font-size:22px}
.tip{border:0;background:none;padding:0 2px;line-height:1;vertical-align:super;font-size:11px;font-weight:700;color:var(--ink)}
.tip.i{vertical-align:middle;display:inline-grid;place-items:center;width:15px;height:15px;border:1.3px solid currentColor;border-radius:50%;font-size:10px;font-weight:700;font-style:normal;padding:0}
.c-cta{margin-top:18px;height:46px;border-radius:var(--r-ctl);border:1.5px solid var(--accent);background:var(--surface);font-size:15px;font-weight:500;transition:background .2s,color .2s}
.c-cta:hover{background:var(--accent);color:var(--accent-ink)}
.card-tight .stats dd{font-size:16.5px}
.card{container-type:inline-size}
/* compact card: same shell, lighter body (used for similar vehicles, optional per section) */
.card.compact .cb{padding:14px 16px 16px}
.card.compact .c-title{font-size:16px}
.card.compact .c-sub{font-size:14px;margin-top:2px}
.c-meta{font-size:12.5px;color:var(--muted);margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta b{color:var(--accent);font-weight:600}
.c-price{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);margin-top:auto}
.c-price .m{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.c-price .m small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.c-price .p{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.card.compact .cmp{width:34px;padding:0;justify-content:center}
.card.compact .cmp span{display:none}
.card.compact .cm-arrow{width:36px;height:36px;margin-top:-18px}
.card.compact .cm-arrow svg{width:13px;height:13px}
.card.compact .cm-arrow.prev{left:-18px;padding-right:4px}
.card.compact .cm-arrow.next{right:-18px;padding-left:4px}
/* guard: a value can never draw over its neighbour */
.stats dt,.stats dd{overflow:hidden;text-overflow:ellipsis;min-width:0}
/* stacked stat row: used per rail when three columns don't fit (set by fitStats() in JS).
   Monthly gets the full line, Purchase price | Mileage share the line below. */
.stats.stack{grid-auto-flow:row;grid-template-columns:1fr 1fr;row-gap:14px}
.stats.stack > div:first-child{grid-column:1/-1;padding:0;border-left:0}
.stats.stack > div:first-child dd{font-size:23px}
.stats.stack > div:nth-child(2){padding-left:0;border-left:0}
.stats.stack > div:nth-child(3){padding-left:14px;border-left:1px solid var(--line-strong)}
@container (max-width:380px){
  .cb{padding:16px 18px 18px}
  .chips{gap:8px}
  .chips li{font-size:12.5px;padding-inline:2px}
}

/* tooltip */
.tipbox{position:fixed;z-index:120;max-width:280px;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:8px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}

/* ---------- compare ---------- */
.ctray{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:40;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:10px 10px 10px 16px;border-radius:14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px)}
.ctray.on{transform:translate(-50%,0)}
.ctray .thumbs{display:flex;gap:6px}
.ctray .thumbs img{width:52px;height:39px;object-fit:cover;border-radius:6px;background:#fff}
.ctray .lbl{font-size:13px;white-space:nowrap}
.ctray button{height:38px;border-radius:9px;border:0;padding:0 14px;font-weight:600;font-size:14px;white-space:nowrap}
.ctray .go{background:#fff;color:var(--ink)}
.ctray .clr{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)}
@media (max-width:520px){.ctray .lbl{display:none}}

/* ---------- generic overlay pieces ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.x-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;flex:none}
.x-btn:hover{background:var(--bg)}
.x-btn svg{width:20px;height:20px}

/* ---------- vehicle popup ---------- */
.vp{position:fixed;inset:0;z-index:70;background:var(--surface);display:flex;flex-direction:column;transform:translateY(24px);opacity:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s}
.vp.on{transform:none;opacity:1}
/* variant A: slide-up panel */
.vp-scrim{position:fixed;inset:0;z-index:69;background:var(--scrim);opacity:0;transition:opacity .35s}
.vp-scrim.on{opacity:1}
.vp.sheet{top:max(48px,7vh);left:max(0px,calc((100vw - 1360px) / 2));right:max(0px,calc((100vw - 1360px) / 2));border-radius:18px 18px 0 0;overflow:hidden;opacity:1;transform:translateY(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px rgba(0,0,0,.35)}
.vp.sheet.on{transform:none}
.vp.sheet .vp-bar{padding-top:10px;cursor:grab;touch-action:none;position:relative}
.sheet-grip{display:none}
.vp.sheet .sheet-grip{display:block;position:absolute;top:7px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line-strong)}
.vp.sheet .vbar{border-radius:0}
/* variant labelling + inline expand */
.stock.variant .stock-head h2{color:var(--accent)}
.stock.variant{background:linear-gradient(to bottom,var(--accent-soft),transparent 70%);padding-top:36px}
.inl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.inl.open{grid-template-rows:1fr}
.inl-clip{overflow:hidden;min-height:0}
.inl-box{position:relative;margin:4px var(--gutter) 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:32px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px}
.inl-x{position:absolute;top:10px;right:10px;z-index:2}
.inl-t{font-size:26px;font-weight:500;margin:0;line-height:1.15;letter-spacing:-.015em;padding-right:40px}
.inl-gal .g-main{border-radius:12px}
.inl-full{border:0;background:none;padding:6px 0;font-size:14px;text-align:left;cursor:pointer}
.card.is-open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@media (max-width:860px){.inl-box{grid-template-columns:1fr;gap:20px;padding:20px}.vp.sheet{top:5vh}}
/* desktop: the panel is a centred window at 95% of the screen */
@media (min-width:861px){
  /* 80% wide x 95% tall; inner content width follows the panel, not the screen */
  .vp.sheet{--cw:min(1240px, calc(80vw - 96px));--pad:48px;top:2.5vh;bottom:2.5vh;left:10vw;right:10vw;border-radius:18px;opacity:0;transform:translateY(18px) scale(.985);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .28s;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
  .vp.sheet.on{opacity:1;transform:none}
  .vp.sheet .sheet-grip{display:none}
  .vp.sheet .vp-bar{padding-top:0;cursor:default}
}
/* phones: sticky bar in the popup is slim and quiet, or off */
@media (max-width:720px){
  .vbar[data-mobile="off"]{display:none}
  .vbar[data-mobile="subtle"]{background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(12px);border-top-color:var(--line)}
  .vbar[data-mobile="subtle"] .in{height:52px;gap:8px}
  .vbar[data-mobile="subtle"] .p b{font-size:14px;font-weight:600}
  .vbar[data-mobile="subtle"] .btn{height:34px;font-size:13px;padding:0 14px;border-radius:999px;border-width:1px}
  .vbar[data-mobile="subtle"] .wa-sm{width:34px;padding:0}
  .vbar[data-mobile="subtle"] .wa-sm svg{width:16px;height:16px}
  .vbar[data-mobile="pill"]{display:none}
  .vfab[data-mobile="pill"]{display:flex}
}
.vp-bar{flex:none;height:60px;display:flex;align-items:center;gap:12px;padding:0 var(--pad);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.vp-bar .crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.vp-bar .crumb b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp-bar .crumb button{border:0;background:none;padding:0;color:var(--muted);font-size:13px}
.vp-bar .crumb button:hover{color:var(--ink);text-decoration:underline}
.vp-bar .sp{flex:1}
.share{height:36px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);padding:0 14px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.share svg{width:15px;height:15px}
.vp-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.vp-wrap{width:var(--cw);margin:0 auto}
.vp-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:56px;padding-top:28px}
.vp-gal{position:sticky;top:20px;align-self:start}
.g-main{position:relative;aspect-ratio:16/10;background:#eef0f3;overflow:hidden;cursor:zoom-in}
.g-main img{width:100%;height:100%;object-fit:cover;display:block}
.g-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.g-thumbs button{position:relative;aspect-ratio:16/10;border:0;padding:0;background:#eef0f3;overflow:hidden}
.g-thumbs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.g-thumbs button:hover img{transform:scale(1.04)}
.g-more{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.g-mob{display:none}

.vi h1{font-size:30px;line-height:1.15;font-weight:500;margin:0;letter-spacing:-.015em;text-wrap:balance}
.vi .vsub{font-size:17px;color:var(--muted);margin:4px 0 0}
.vi .lbl{font-size:13px;color:var(--muted)}
.price-blk{margin-top:22px}
.price-big{font-size:30px;font-weight:500;letter-spacing:-.015em;line-height:1.15}
.price-big small{font-size:30px}
.price-list{font-size:13px;color:var(--muted);margin-top:2px}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-block:1px solid var(--line);padding-block:14px;margin-top:20px}
.kstats dt{font-size:13px;color:var(--muted)}
.kstats dd{margin:0;font-size:14px;font-weight:500}
.speclist{margin:22px 0 0;display:grid;gap:12px}
.speclist dt{font-size:13px;color:var(--muted)}
.speclist dd{margin:0;font-size:14px}
.kgrid{margin:22px 0 0;display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.kgrid > div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kgrid dt{color:var(--muted)}
.kgrid dd{margin:0;font-weight:600;text-align:right}
.pack{border-top:1px solid var(--line);padding-block:22px;margin-top:22px}
.pack + .pack{margin-top:0}
.pack-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pack-h h2{font-size:22px;font-weight:500;margin:0;letter-spacing:-.01em}
.readmore{border:0;background:none;padding:0;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.readmore i{color:var(--accent);font-style:normal;font-size:18px;line-height:1}
.pack ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px;font-size:14px}
.hl{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}
.hl h2{font-size:22px;font-weight:500;margin:0;letter-spacing:-.01em}
.hl-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.hl-figs div{background:var(--accent-soft);border-radius:12px;padding:14px}
.hl-figs b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
@media (max-width:720px){.hl-figs{gap:8px}.hl-figs div{padding:12px 10px}.hl-figs b{font-size:16px;white-space:nowrap}}
.hl-figs span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.hl p{font-size:14px;color:var(--muted);margin:12px 0 0}
.hl ul{margin:10px 0 0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.spec-req{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:16px 18px;margin-top:22px}
.spec-req b{font-size:15px}
.spec-req p{margin:2px 0 0;font-size:13px;color:var(--muted);max-width:34ch}
.spec-req .btn{height:44px;font-size:14px}
.rows{border-block:1px solid var(--line);padding-block:10px;margin-top:22px}
.rows button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:6px 0;font-size:22px;font-weight:500;letter-spacing:-.01em;text-align:left}
.rows button svg{width:18px;height:18px;transition:transform .2s}
.rows button:hover svg{transform:translateX(3px)}
.acts{display:grid;gap:10px;margin-top:24px}
.btn{height:50px;border-radius:var(--r-ctl);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 18px;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);transition:background .2s,color .2s}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2a2e37}
.btn.ac{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:18px;height:18px}
.acts .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn.sm{height:46px;font-size:14px;font-weight:500}
.wa{border-color:#25d366}
.wa svg{color:#1a9e4b}

/* full-width popup sections */
.vsec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:48px;border-top:1px solid var(--line);padding-block:48px;margin-top:48px}
.vsec + .vsec{margin-top:0}
.vsec h2{font-size:28px;line-height:1.15;font-weight:500;margin:0;letter-spacing:-.015em}
.vsec .lead{color:var(--muted);font-size:14px;margin:10px 0 0;max-width:38ch}
.seg{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.seg button{border:0;background:none;padding:0 0 10px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.sl{margin-bottom:22px}
.sl-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.sl-top b{color:var(--ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--ink);height:24px}
.bd{display:grid;margin-top:8px}
.bd > div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.bd > div.tot{font-weight:700;font-size:16px;border-bottom:1.5px solid var(--ink)}
.bd span:first-child{color:var(--muted)}
.bd .tot span:first-child{color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55}
.fixed-box{background:var(--bg);border-radius:12px;padding:20px}
.fixed-box .price-big{font-size:26px}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form .full{grid-column:1/-1}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.fld label em{color:var(--err);font-style:normal}
.fld input,.fld select,.fld textarea{width:100%;height:46px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);padding:0 12px;font-size:15px}
.fld textarea{height:96px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld.bad input,.fld.bad select{border-color:var(--err)}
.fld .err{color:var(--err);font-size:12px;margin-top:4px;display:none}
.fld.bad .err{display:block}
.vehicle-pin{grid-column:1/-1;display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px}
.vehicle-pin img{width:72px;height:54px;object-fit:cover;border-radius:8px;background:#fff}
.vehicle-pin b{display:block;font-size:14px}
.vehicle-pin span{font-size:13px;color:var(--muted)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;margin:0;font-weight:400}
.radios input{accent-color:var(--accent);width:auto;height:auto}
.consent{grid-column:1/-1;display:grid;gap:10px;font-size:13px;color:var(--muted)}
.consent label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.consent input{margin-top:2px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.consent .bad{color:var(--err)}
.form .submit{grid-column:1/-1}
.mock-flag{grid-column:1/-1;font-size:12px;color:var(--faint)}
.lead-success{grid-column:1/-1;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.lead-success svg{width:24px;height:24px;flex:none;margin-top:2px}
.lead-success b{display:block;color:var(--ink);font-size:16px}
.lead-success p{margin:4px 0 0;color:var(--ink);font-size:14px}
.sending .submit{opacity:.6;pointer-events:none}

.person{display:flex;gap:14px;align-items:center;margin-top:22px}
.person .av{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.person b{display:block}
.person span{font-size:13px;color:var(--muted)}
.loc{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.loc .map{aspect-ratio:16/10;border-radius:12px;background:
  linear-gradient(90deg,transparent 49.5%,var(--line-strong) 49.5% 50.5%,transparent 50.5%) 0 0/56px 56px,
  linear-gradient(0deg,transparent 49.5%,var(--line-strong) 49.5% 50.5%,transparent 50.5%) 0 0/56px 56px,#eceff3;position:relative;display:grid;place-items:center}
.loc .pin{width:18px;height:18px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);box-shadow:0 0 0 6px rgba(61,90,224,.18)}
.hours{display:grid;gap:4px;font-size:14px;margin-top:12px}
.hours div{display:flex;justify-content:space-between;max-width:280px}
.link{color:var(--accent);font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline}

.acc{border-bottom:1px solid var(--line)}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:14px 0;font-size:15px;text-align:left}
.acc button svg{width:16px;height:16px;transition:transform .25s}
.acc button[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc .acc-p{font-size:13px;color:var(--muted);padding:0 0 16px;line-height:1.6}

.sim .rail{padding-inline:0;scroll-padding-inline:0}
.sim .rail > *{flex-basis:calc((var(--cw) * 2 / 3 - 48px - 2 * var(--gap)) / 2.6)}

/* sticky action bar */
.vbar{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#f6f7f9;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar.on{transform:none}
/* mobile floating pill (settings.popup.mobileStickyBar = "pill") */
.vfab{display:none;position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;gap:8px;align-items:center;opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.vfab.on{opacity:1;transform:none;pointer-events:auto}
.fab-enq{height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:14px;font-weight:600;box-shadow:0 8px 24px -8px rgba(0,0,0,.45)}
.fab-wa{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #25d366;color:#1a9e4b;display:grid;place-items:center;box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
.fab-wa svg{width:20px;height:20px}
.vbar .in{width:var(--cw);margin:0 auto;height:78px;display:flex;align-items:center;gap:12px}
.vbar .p{margin-right:auto;min-width:0}
.vbar .p > span{font-size:13px;color:var(--muted)}
.vbar .p b{display:block;font-size:17px;font-weight:600;white-space:nowrap}
.vbar .btn{height:44px;white-space:nowrap;flex:none}
@media (max-width:720px){.vbar .p b{font-size:15px}.vbar .in{gap:8px}}
.vbar .wa-sm{width:44px;padding:0}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);z-index:90;background:var(--surface);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px -30px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dr-head{flex:none;padding:22px 32px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-head h3{margin:0;font-size:24px;font-weight:500}
.dr-tabs{flex:none;display:flex;gap:22px;padding:14px 32px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dr-tabs button{border:0;background:none;padding:0 0 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dr-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.dr-body{flex:1;overflow-y:auto;padding:22px 32px 48px;overscroll-behavior:contain}
.dr-intro{font-size:15px;margin:0 0 22px;line-height:1.55}
.fcard{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-bottom:16px}
.fcard img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.fcard div{padding:22px;display:flex;flex-direction:column;justify-content:center}
.fcard h4{margin:0;font-size:19px;font-weight:500}
.fcard p{margin:8px 0 0;font-size:14px;line-height:1.55;color:var(--muted)}
.stable > div{display:grid;grid-template-columns:2fr 3fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.stable dt{color:var(--muted)}
.stable dd{margin:0}
.fgroup h4{font-size:22px;font-weight:500;margin:6px 0 10px}
.fgroup h5{font-size:13px;color:var(--muted);font-weight:500;margin:16px 0 6px}
.fgroup ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.fgroup + .fgroup{margin-top:26px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.on{opacity:1;pointer-events:auto}
.lb-panel{position:relative;background:var(--surface);width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;padding:48px 22px 18px}
.lb-panel .x-btn{position:absolute;top:6px;right:8px}
.lb-stage{position:relative;aspect-ratio:16/10;background:#eef0f3;overflow:hidden;touch-action:pan-y}
.lb-stage img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.lb-stage.angles{cursor:ew-resize}
.lb-nav{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(80,84,94,.62);color:#fff;display:grid;place-items:center}
.lb-nav svg{width:16px;height:16px}
.lb-nav.prev{left:12px}.lb-nav.next{right:12px}
.lb-mode{position:absolute;right:10px;bottom:10px;display:flex;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lb-mode button{border:0;background:#fff;padding:8px 12px;font-size:13px}
.lb-mode button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lb-hint{position:absolute;left:12px;bottom:12px;font-size:12px;background:rgba(255,255,255,.9);padding:6px 10px;border-radius:999px}
.lb-thumbs{display:flex;gap:6px;justify-content:center;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.lb-thumbs button{flex:none;width:72px;aspect-ratio:4/3;border:2px solid transparent;padding:0;background:#eef0f3}
.lb-thumbs button[aria-current="true"]{border-color:var(--accent)}
.lb-thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* compare dialog */
.cdlg{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.cdlg.on{opacity:1;pointer-events:auto}
.cdlg-panel{background:var(--surface);border-radius:16px;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.cdlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.cdlg-head h3{margin:0;font-size:20px;font-weight:600}
.cdlg-body{overflow:auto}
.ctable{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.ctable th,.ctable td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ctable th{color:var(--muted);font-weight:500;width:160px;position:sticky;left:0;background:var(--surface)}
.ctable td{font-variant-numeric:tabular-nums}
.ctable .cimg img{width:100%;max-width:220px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#fff;border:1px solid var(--line)}
.ctable .cname{font-weight:700;font-size:15px}
.ctable .best{color:var(--ok);font-weight:700}

/* footer */
.foot{background:var(--surface);border-top:1px solid var(--line)}
.foot .in{margin:0 var(--gutter);padding-block:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;font-size:14px}
.foot h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.foot p{margin:0}
.ca-band{background:var(--banner);color:#cfd2d8;font-size:12px;text-align:center;padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px))}
.ca-band b{color:#fff;font-weight:600}
@media (max-width:720px){.foot .in{grid-template-columns:1fr}}

/* ---------- popup: tablet & mobile ---------- */
@media (max-width:960px){
  .vp-grid{grid-template-columns:1fr;gap:0;padding-top:0}
  .vp-gal{position:static}
  .vp-gal .g-desk{display:none}
  .g-mob{display:block}
  .vi{padding-top:4px}
  .vi .ttl-desk{display:none}
  .vsec{grid-template-columns:1fr;gap:20px;padding-block:36px;margin-top:36px}
  .sim .rail > *{flex-basis:calc((100vw - 32px) / 2.3 - var(--gap))}
  .loc{grid-template-columns:1fr}
}
.g-mob .ttl{padding:18px 0 14px}
.g-mob .ttl h1{font-size:26px;font-weight:500;margin:0;line-height:1.15}
.g-mob .ttl p{margin:4px 0 0;color:var(--muted)}
.gm-stage{position:relative;margin-inline:calc(-1 * max(16px, (100vw - var(--cw)) / 2));background:#eef0f3}
.gm-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/3}
.gm-track::-webkit-scrollbar{display:none}
.gm-track img{flex:0 0 100%;width:100%;object-fit:cover;scroll-snap-align:center}
.gm-arrow{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(80,84,94,.62);color:#fff;display:grid;place-items:center}
.gm-arrow svg{width:14px;height:14px}
.gm-arrow.prev{left:12px}.gm-arrow.next{right:12px}
.gm-mode{position:absolute;right:12px;bottom:12px;display:flex;background:#fff}
.gm-mode button{border:0;background:#fff;padding:8px 12px;font-size:13px}
.gm-thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.gm-thumbs button{flex:0 0 26%;aspect-ratio:4/3;border:2px solid transparent;padding:0;background:#eef0f3}
.gm-thumbs button[aria-current="true"]{border-color:var(--accent)}
.gm-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:720px){
  .vp-bar{height:54px}
  .share span{display:none}
  .vi .price-big,.vi .price-big small{font-size:26px}
  .kgrid{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .fcard{grid-template-columns:1fr}
  .fcard img{aspect-ratio:16/10}
  .dr-head,.dr-tabs,.dr-body{padding-inline:20px}
  .drawer{width:100vw}
  .vbar .p > span{display:none}
  .vbar .btn.sec{display:none}
  .stable > div{grid-template-columns:1fr 1fr}
  .sim .rail > *{flex-basis:calc((100vw - 16px) / 1.65 - var(--gap))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* =====================================================================
   PAGE SECTIONS + DARK MODE (theme.mode = "dark")
   Layout: one-pager, full-bleed hero video, then left-aligned blocks on the
   page gutter. Dark mode keeps every card and popup layout exactly as the
   template draws it and only swaps the colours.
   ===================================================================== */
:root{--display:"Archivo","Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--photo:#eef0f3;--raise:var(--bg)}
:root[data-mode="dark"]{
  color-scheme:dark;
  --bg:#0a0b0d; --surface:#131417; --raise:#1b1d21; --photo:#0f1012;
  --ink:#f1f2f4; --muted:#a4a9b2; --faint:#767c87;
  --line:#25282e; --line-strong:#3a3e46;
  --accent:#c8ccd3; --accent-ink:#0a0b0d; --accent-soft:color-mix(in srgb,var(--accent) 9%,#131417);
  --ok:#62d394; --ok-soft:#12251a; --err:#ff8072; --scrim:rgba(0,0,0,.72); --banner:#000;
}
:root[data-mode="dark"] .site-head{background:rgba(10,11,13,.84);border-bottom-color:var(--line)}
:root[data-mode="dark"] .mock-note{background:#17191d}
:root[data-mode="dark"] .cm,:root[data-mode="dark"] .g-main,:root[data-mode="dark"] .g-thumbs button,:root[data-mode="dark"] .lb-stage,
:root[data-mode="dark"] .gm-stage,:root[data-mode="dark"] .gm-thumbs button,:root[data-mode="dark"] .lb-thumbs button,
:root[data-mode="dark"] .vehicle-pin img,:root[data-mode="dark"] .ctable .cimg img,:root[data-mode="dark"] .ctray .thumbs img{background:var(--photo)}
:root[data-mode="dark"] .cm::after{background:linear-gradient(to bottom,rgba(19,20,23,0),var(--surface))}
:root[data-mode="dark"] .cm-dots i{background:rgba(255,255,255,.28)}
:root[data-mode="dark"] .cmp{background:rgba(19,20,23,.8);border-color:var(--line-strong);color:var(--ink)}
:root[data-mode="dark"] .card:hover{border-color:var(--line-strong);box-shadow:0 18px 44px -24px rgba(0,0,0,.95)}

.pg-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.4) 55%,rgba(0,0,0,.9) 100%)}

.pg-hero .pg-btn:hover{border-color:#fff}

.pg-hero .pg-btn.pri:hover{background:transparent;color:#fff}

.pg-facts dt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.66);margin-top:2px}
.pg-facts dd{margin:0;font-family:var(--display);font-stretch:125%;font-size:28px;font-weight:600;line-height:1}

/* marques */
.pg-makes{padding-block:44px 8px}
.pg-make-list{margin:0 var(--gutter);display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));border-top:1px solid var(--line)}
.pg-make-list a{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 4px 16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-family:var(--display);font-stretch:112%;font-size:17px;font-weight:600;margin-right:20px}

.pg-make-list a:hover span{text-decoration:underline;text-underline-offset:4px}

/* spotlight */
.pg-spot{padding-block:48px 12px}

.pg-spot-grid.n2{grid-template-rows:1fr}
.pg-tile{position:relative;overflow:hidden;border:0;padding:0;border-radius:var(--r-card);background:var(--photo);color:#fff;text-align:left;cursor:pointer;min-height:0}
.pg-spot-grid.n3 .pg-tile:first-child{grid-row:1/3}

.pg-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.9))}

/* banners */

.pg-about{margin:64px var(--gutter) 0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,72px);align-items:center}

<script>
(function(){

/* ---------- PRE-LAUNCH CHECK ----------------------------------------------------
   Lists everything that must be fixed before a site goes live. The same function
   runs in the publish step, which refuses to publish while anything is listed.
   Placeholder wording below must match the default template's placeholder text. */
const PLACEHOLDERS = new Set(['Car name','Vehicle model','Section title','Section intro text','Section label','Dealer name','DEALER NAME','Brands sold',
  'Street address, Suburb, City, 0000','000 000 0000','27000000000','email@dealer.co.za','Exterior colour','Interior colour/trim','Wheel size & style','Gearbox type','Fuel type',
  'Extra copy line (optional)','Pack name','Pack intro text.','Feature item','Feature title','Feature description text.','Spec label','Spec value','Feature group','Feature sub-group','Pack name',
  'Service or plan','Plan term','Highlight title','Highlight text.','Figure label','00','Year','00,000','STOCK-000','Dealer notes text.','Salesperson name','Salesperson role','SN',
  'Finance provider name','Engine size','Brand name','000 kW','0.0 s','0.0 l/100 km','History item','History detail','Location search text','00:00 – 00:00','Day(s)','Fixed offer terms.','Price note text.','0']);
function prelaunchCheck(data){
  const issues = [];
  const add = (where, what) => issues.push({where, what});
  const walk = (node, path, where) => {
    if (typeof node === 'string') { const s = node.trim(); if (PLACEHOLDERS.has(s) || PLACEHOLDERS.has(s.replace(/ \d+$/, '')) || /^placeholder-/.test(s)) add(where, `${path}: "${node}"`); return; }
    if (Array.isArray(node)) { node.forEach((x, i) => walk(x, path, where)); return; }
    if (node && typeof node === 'object') Object.entries(node).forEach(([k, v]) => walk(v, path ? path + ' › ' + k : k, where));
  };
  walk(data.dealer, '', 'Dealer details');
  (data.sections || []).forEach((s, i) => {
    const where = `Section ${i + 1} (${s.title})`;
    walk({title:s.title, intro:s.intro, label:s.label}, '', where);
    if ((s.vehicles || []).length > 15) add(where, `${s.vehicles.length} vehicles: a section holds up to 15`);
    if (!(s.vehicles || []).length) add(where, 'has no vehicles');
  });
  Object.entries(data.models || {}).forEach(([k, m]) => walk(m, '', `Model content "${k}"`));
  (data.vehicles || []).forEach((v, n) => {
    const where = `Vehicle ${n + 1}: ${v.title}${v.stock ? ' · ' + v.stock : ''}`;
    const {id, slug, model, condition, priceMode, finance, ...rest} = v;
    walk(rest, '', where);
    if (!v.price && v.priceMode !== 'poa') add(where, 'price not set');
    if (!(v.images || []).length) add(where, 'no photos');
    if (v.condition !== 'new' && (v.km == null || v.km === '' || typeof v.km === 'string')) add(where, 'mileage not set');
    if (v.priceMode === 'fixed' && !v.monthlyFixed) add(where, 'fixed monthly payment not set');
    [['title','car name'],['sub','model line'],['year','year'],['transmission','gearbox'],['fuel','fuel type']].forEach(([k, l]) => {
      if (v[k] == null || String(v[k]).trim() === '') add(where, l + ' is empty'); });
    if (!(data.sections || []).some(s => (s.vehicles || []).includes(v.id))) add(where, 'not in any section, so it does not show on the site');
    if ((data.vehicles || []).filter(x => x.slug === v.slug).length > 1) add(where, `link name "${v.slug}" is used by another car`);
  });

    const pg = data.page, W = 'Page sections', secIds = new Set((data.sections || []).map(s => s.id)), vIds = new Set((data.vehicles || []).map(v => v.id));
    walk(pg, '', W);
    if (pg.hero && !pg.hero.video && !pg.hero.poster) add(W, 'hero has no video or image');
    ((pg.spotlight || {}).items || []).forEach(x => { const id = Array.isArray(x) ? x[0] : x && x.id; if (!vIds.has(id)) add(W, `spotlight car "${id || 'none chosen'}" is not in the stock list`); });

}

    <div class="plc-b">${Object.entries(groups).map(([g, list]) => `<section><h4>${g.replace(/[&<>]/g,'')} <i>${list.length}</i></h4><ul>${list.map(x => `<li>${x.replace(/[&<>]/g,'')}</li>`).join('')}</ul></section>`).join('')}</div>`;

})();
const V = Object.fromEntries(DATA.vehicles.map(v => [v.id, v]));
const SEC_OF = {}; DATA.sections.forEach(s => s.vehicles.forEach(id => { if(!SEC_OF[id]) SEC_OF[id] = s; }));
const IMG = k => (window.__CA_IMGMAP || {})[k] || (/^(data:|blob:|https?:|\/|\.)/.test(k) ? k : /\.[a-z0-9]{3,4}$/i.test(k) ? 'img/' + k : 'img/' + k + '.jpg');
const CNT = Object.assign({show:true, singular:'vehicle', plural:'vehicles'}, (DATA.settings||{}).sectionCount);
const countText = n => CNT.show ? n + ' ' + (n === 1 ? CNT.singular : CNT.plural) : '';
const POP = Object.assign({detailStyle:'sheet', mobileStickyBar:'off'}, (DATA.settings||{}).popup);
const SIM = Object.assign({cardStyle:'compact', max:6}, (DATA.settings||{}).similarVehicles);
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- money & finance ---------- */
const grp = n => typeof n === 'string' ? n : Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const R = (n, cents=false) => {
  if (n == null || isNaN(n)) return '—';
  if (n === 0) return cents ? 'R0,000.00' : 'R000,000';   // placeholder price (default template)
  if (!cents) return 'R ' + grp(n);
  const neg = n < 0; n = Math.abs(n);
  const whole = Math.floor(n + 1e-9), c = Math.round((n - whole) * 100);
  return (neg?'-':'') + 'R ' + grp(whole + (c === 100 ? 1 : 0)) + '.' + String(c === 100 ? 0 : c).padStart(2, '0');
};
const condLabel = c => ({new:'New', demo:'Demo', used:'Pre-owned'})[c];
const isPOA = v => v.priceMode === 'poa';
const priceText = v => isPOA(v) ? 'Price on request' : R(v.price);
function termsFor(v){ return Object.assign({}, D.finance, v.finance || {}); }
function calc(price, t){
  if (!price) return { deposit:0, balloon:0, principal:0, inst:0, monthly:0, total:0 };
  const deposit = price * t.depositPct / 100;
  const balloon = price * t.balloonPct / 100;
  const principal = price - deposit + t.initiationFee;
  const r = t.ratePct / 1200, n = t.termMonths;
  const inst = r ? (principal - balloon / Math.pow(1 + r, n)) * r / (1 - Math.pow(1 + r, -n)) : (principal - balloon) / n;
  const monthly = inst + t.monthlyFee;
  return { deposit, balloon, principal, inst, monthly, total: deposit + monthly * n + balloon };
}
function monthlyOf(v){
  if (v.priceMode === 'cash' || v.priceMode === 'poa') return null;
  if (v.priceMode === 'fixed') return v.monthlyFixed;

}
function basisText(v, t){
  if (v.priceMode === 'fixed') return v.monthlyNote || 'Fixed dealer offer.';
  t = t || termsFor(v); const f = calc(v.price, t);
  return `Based on ${t.termMonths} months, ${t.depositPct}% deposit (${R(f.deposit)}), ${t.ratePct}% interest and a ${t.balloonPct}% balloon (${R(f.balloon)}).`;
}

  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>',
  cmp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4L3 8l4 4"/><path d="M3 8h13"/><path d="M17 12l4 4-4 4"/><path d="M21 16H8"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3z"/></svg>',

};
const waLink = (v) => 'https://wa.me/' + D.whatsapp + '?text=' + encodeURIComponent(v ? `Hi ${D.name}, I'm interested in the ${v.year || ''} ${v.title} ${v.sub} (stock ${v.stock})${isPOA(v) ? '. Please send me the price.' : ' at ' + R(v.price) + '.'} ${location.href.split('#')[0]}#v-${v.slug}` : `Hi ${D.name}, I have a question.`);

/* ---------- optional: header hides on scroll down, reveals on scroll up ---------- */
(function headerOnScroll(){
  const cfg = (DATA.settings && DATA.settings.header) || {};
  const hos = cfg.hideOnScroll || {};
  if (!hos.mobile && !hos.desktop) return;               // feature off for this build
  const head = $('.site-head');
  const mq = matchMedia(`(max-width:${cfg.mobileMaxWidth || 720}px)`);
  const enabled = () => mq.matches ? !!hos.mobile : !!hos.desktop;
  const DELTA = cfg.revealAfterPx || 8;                  // ignore tiny jitters
  let lastY = scrollY, ticking = false;
  const update = () => {
    ticking = false;
    const y = Math.max(0, scrollY);
    if (!enabled() || y < head.offsetHeight || document.documentElement.style.overflow === 'hidden') {
      head.classList.remove('is-hidden'); lastY = y; return;
    }
    if (Math.abs(y - lastY) < DELTA) return;
    head.classList.toggle('is-hidden', y > lastY);       // down = hide, up = show
    lastY = y;
  };
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, {passive:true});
  mq.addEventListener('change', update);
  head.addEventListener('focusin', () => head.classList.remove('is-hidden'));   // keyboard users can always reach it

/* ---------- momentum rail ---------- */
function rail(el){
  // Free scroll. Touch and trackpads use the browser's own momentum.
  // Mouse drag gets JS inertia: velocity from the last ~100 ms of movement,
  // then an exponential glide that eases out and stops wherever it lands.
  let down=false, sx=0, ss=0, moved=0, raf=0, samples=[];
  const FRICTION = 0.955;            // per 16 ms frame; closer to 1 = longer glide
  const endDrag = () => el.classList.remove('dragging');
  const glide = vel => {
    let prev = performance.now();
    const step = now => {
      const dt = Math.min(40, now - prev); prev = now;
      el.scrollLeft -= vel * dt;
      vel *= Math.pow(FRICTION, dt / 16);
      const max = el.scrollWidth - el.clientWidth;
      const atEdge = (el.scrollLeft <= 0 && vel > 0) || (el.scrollLeft >= max - 1 && vel < 0);
      if (Math.abs(vel) > 0.02 && !atEdge) raf = requestAnimationFrame(step); else endDrag();
    };
    raf = requestAnimationFrame(step);
  };
  el.addEventListener('pointerdown', e => {
    cancelAnimationFrame(raf); endDrag();            // any touch stops a glide in place
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    if (e.target.closest('button,a,input')) return;
    down = true; moved = 0; sx = e.clientX; ss = el.scrollLeft;
    samples = [{x:e.clientX, t:performance.now()}];
  });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx));
    if (moved > 5 && !el.classList.contains('dragging')) el.classList.add('dragging');
    if (!el.classList.contains('dragging')) return;
    el.scrollLeft = ss - dx;
    const now = performance.now(); samples.push({x:e.clientX, t:now});
    while (samples.length > 2 && now - samples[0].t > 100) samples.shift();
  });
  window.addEventListener('pointerup', () => {
    if (!down) return; down = false;
    if (!el.classList.contains('dragging')) return;
    const now = performance.now(), a = samples[0], b = samples[samples.length-1];
    let vel = (b && a && b.t > a.t && now - b.t < 60) ? (b.x - a.x) / (b.t - a.t) : 0;   // px per ms
    vel = Math.max(-6, Math.min(6, vel));
    if (reduce || Math.abs(vel) < 0.05) endDrag(); else glide(vel);
    el.dataset.justDragged = '1'; setTimeout(() => delete el.dataset.justDragged, 50);
  });
  el.addEventListener('wheel', () => cancelAnimationFrame(raf), {passive:true});
  el.addEventListener('click', e => { if (el.dataset.justDragged || moved > 5) { e.stopPropagation(); e.preventDefault(); moved = 0; } }, true);
  return el;
}
function railButtons(sec){
  const el = $('.rail', sec), bs = $$('.rail-btn', sec);
  const upd = () => { bs[0].disabled = el.scrollLeft < 4; bs[1].disabled = el.scrollLeft > el.scrollWidth - el.clientWidth - 4; };
  bs.forEach(b => b.addEventListener('click', () => {
    const card = el.children[0]; const stepW = card ? card.getBoundingClientRect().width + parseFloat(getComputedStyle(el).columnGap || 20) : 300;
    const n = Math.max(1, Math.floor(el.clientWidth / stepW) - 1);

}

/* ---------- layer stack (popup, drawer, lightbox, compare) ---------- */
const stack = [];
function openLayer(sel){
  const el = $(sel); el.hidden = false; stack.push(sel);
  document.documentElement.style.overflow = 'hidden';
  if (sel === '#drawer') { const s = $('#scrim'); s.hidden = false; s.style.zIndex = 85; requestAnimationFrame(() => s.classList.add('on')); }
  if (sel === '#lb' || sel === '#cdlg') { const s = $('#scrim'); s.hidden = false; s.style.zIndex = sel === '#lb' ? 99 : 94; requestAnimationFrame(() => s.classList.add('on')); }
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  el.setAttribute('tabindex', '-1'); el.style.outline = 'none';
  setTimeout(() => el.focus({preventScroll:true}), 60);
}
function closeLayer(sel){
  const el = $(sel); el.classList.remove('on');
  const i = stack.lastIndexOf(sel); if (i > -1) stack.splice(i, 1);
  const needScrim = stack.find(s => s !== '#vp');
  const s = $('#scrim');
  if (!needScrim) { s.classList.remove('on'); setTimeout(() => { if (!stack.find(x => x !== '#vp')) s.hidden = true; }, 300); }
  else s.style.zIndex = needScrim === '#drawer' ? 85 : needScrim === '#lb' ? 99 : 94;
  setTimeout(() => { if (!el.classList.contains('on')) el.hidden = true; }, 400);
  if (!stack.length) document.documentElement.style.overflow = '';
}
$('#scrim').addEventListener('click', () => { const top = stack[stack.length-1]; if (top && top !== '#vp') top === '#drawer' ? closeDrawer() : closeLayer(top); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !stack.length) return;
  const top = stack[stack.length-1];
  if (top === '#vp') closeVehicle(); else if (top === '#drawer') closeDrawer(); else closeLayer(top);
});

/* ---------- content resolver: every block reads from here; missing = empty = hidden ---------- */
function parseExtras(t){
  // dealer/AutoTrader-style extras: "ABS,Cruise Control, Rear PDC ..." -> clean, de-duplicated list
  const seen = new Set();
  return String(t||'').split(/[,;\n|]+/).map(s => s.trim().replace(/\s{2,}/g,' ').replace(/\.$/,'')).filter(s => {
    const k = s.toLowerCase(); if (s.length < 2 || seen.has(k)) return false; seen.add(k); return true; });
}
function content(v){
  const base = DATA.models[v.model] || {}, own = v.content || {};
  const pick = k => own[k] !== undefined ? own[k] : base[k];
  const c = {
    make: pick('make') || v.make || '',
    stats: pick('stats') || [], specs: pick('specs') || [], packs: pick('packs') || [],
    features: Object.assign({}, pick('features') || {}), services: pick('services') || [],
    highlights: [...(base.highlights || []), ...(v.highlights || [])]
  };
  if (v.extrasText) { const list = parseExtras(v.extrasText); if (list.length) c.features['Equipment'] = {'From the dealer\'s stock listing': list}; }
  return c;
}
function statOf(c, label){ const f = (c.stats.concat(c.specs)).find(s => s[0].toLowerCase().startsWith(label.toLowerCase())); return f ? f[1] : null; }
function keyStats(v, c){
  const pool = [];
  if (v.condition !== 'new' && v.km != null) pool.push(['Mileage', grp(v.km) + ' km']);
  if (v.condition === 'used' && v.year) pool.push(['Year', v.year]);
  c.stats.forEach(s => pool.push(s));
  if (v.condition !== 'used' && v.year) pool.push(['Model year', v.year]);
  pool.push(['Transmission', v.transmission], ['Fuel', v.fuel], ['Engine', v.engine], ['Colour', v.colour]);
  const seen = new Set();
  return pool.filter(s => s && s[1] != null && s[1] !== '' && !seen.has(s[0]) && seen.add(s[0])).slice(0, 3);
}
function infoTabs(v, c){
  const tabs = [];
  if (c.specs.length) tabs.push({key:'spec', label:'Specification'});
  if (Object.keys(c.features).length || v.dealerNotes) tabs.push({key:'feat', label:'Features'});
  if (v.condition === 'used' ? (v.history||[]).length : c.services.length) tabs.push({key:'third', label: v.condition === 'used' ? 'History & warranty' : 'Services'});
  return tabs;
}

function similar(v){

}
let curMode = 'page';
function openVehicle(id, fromHash, mode){
  const v = V[id]; if (!v) return;
  const vp = $('#vp'), open = vp.classList.contains('on');
  if (mode || !open) curMode = mode || (POP.detailStyle === 'sheet' ? 'sheet' : 'page');
  if (!open) { vp.classList.toggle('sheet', curMode === 'sheet'); vp.style.transform = ''; }
  if (curMode === 'sheet' && !open) { const s = $('#vp-scrim'); s.hidden = false; requestAnimationFrame(() => s.classList.add('on')); }
  cur = v; terms = termsFor(v);
  const m = content(v), sec = SEC_OF[id];

  const sc = $('#vp-scroll'); sc.scrollTop = 0; requestAnimationFrame(() => { sc.scrollTop = 0; });   // reset after unhiding: a hidden scroller ignores scrollTop and keeps the last car's depth
  wireVehicle(v, m);

  const s = $('#vp-scrim'); s.classList.remove('on'); setTimeout(() => { s.hidden = true; }, 350);

  try { history.replaceState(null, '', location.pathname + location.search); } catch(_) {}

}

$('#vp-scrim').addEventListener('click', closeVehicle);
(function sheetDrag(){
  const vp = $('#vp'), bar = $('.vp-bar', vp); let y0 = null, dy = 0;
  bar.addEventListener('pointerdown', e => { if (!vp.classList.contains('sheet') || !matchMedia('(max-width:860px)').matches || e.target.closest('button,a')) return; y0 = e.clientY; dy = 0; bar.setPointerCapture(e.pointerId); vp.style.transition = 'none'; });
  bar.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); vp.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; vp.style.transition = ''; if (dy > 120) closeVehicle(); else vp.style.transform = ''; };

})();

    <button class="btn pri submit" type="submit">${btn}</button>
    <p class="mock-flag">Mockup: nothing is sent. On success, a trackable element <code>#lead-success</code> is added to the page.</p>
  </form>`;
}

/* ---------- popup wiring ---------- */
function wireVehicle(v, m){
  const root = $('#vp-scroll');
  // galleries
  $$('[data-lb]', root).forEach(b => b.addEventListener('click', () => openLB(+b.dataset.lb)));
  $$('[data-lb-ang]', root).forEach(b => b.addEventListener('click', () => openLB(0, true)));
  const gm = $('#gm-track', root), gmt = $$('#gm-thumbs button', root);
  if (gm) {
    gm.addEventListener('scroll', () => { const i = Math.round(gm.scrollLeft / gm.clientWidth); gmt.forEach((b,j) => b.setAttribute('aria-current', i===j)); }, {passive:true});
    gmt.forEach(b => b.addEventListener('click', () => gm.scrollTo({left: +b.dataset.gm * gm.clientWidth, behavior: reduce?'auto':'smooth'})));
    $('.gm-arrow.prev', root).onclick = () => gm.scrollBy({left:-gm.clientWidth, behavior: reduce?'auto':'smooth'});
    $('.gm-arrow.next', root).onclick = () => gm.scrollBy({left: gm.clientWidth, behavior: reduce?'auto':'smooth'});
  }
  // packs & spec rows -> drawer
  $$('[data-pack]', root).forEach(b => b.addEventListener('click', () => openPacks(v, m, +b.dataset.pack)));
  $$('[data-spec]', root).forEach(b => b.addEventListener('click', () => openSpecs(v, m, b.dataset.spec)));
  $$('[data-go="specsheet"]', root).forEach(b => b.addEventListener('click', () => { goEnquire(); const t = $('#enquire-msg'); if (t) t.value = 'Please send me the full specification sheet and equipment list for this vehicle.'; }));
  // actions
  $$('[data-go="enquire"]', root).forEach(b => b.addEventListener('click', goEnquire));
  $$('[data-form]', root).forEach(b => b.addEventListener('click', () => openFormDrawer(b.dataset.form, v)));
  // accordions
  $$('.acc button', root).forEach(b => b.addEventListener('click', () => { const on = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', !on); $('#' + b.getAttribute('aria-controls')).hidden = on; }));
  // finance sliders
  if (v.priceMode === 'calculated') wireFinance(v);
  // forms
  $$('form', root).forEach(wireForm);
  // similar rail
  const sr = $('.sim .rail', root); rail(sr); $$('.card', sr).forEach(wireCard);
  requestAnimationFrame(() => fitStats(root));
  syncCmp();
  // sticky bar
  renderBar(v); watchBar();
}
function goEnquire(){
  const t = $('#vs-enquire'); const sc = $('#vp-scroll');
  sc.scrollTo({top: t.offsetTop - 12, behavior: reduce?'auto':'smooth'});
  setTimeout(() => { const f = $('#enquire-first'); f && f.focus({preventScroll:true}); }, reduce ? 0 : 500);
}

function wireFinance(v){
  const sDep = $('#s-dep'), sTerm = $('#s-term'), sBal = $('#s-bal'), bd = $('#bd');
  let noBalloon = false; const balBefore = terms.balloonPct;
  const segBtns = $$('#vs-finance .seg button');
  segBtns.forEach((b,i) => b.addEventListener('click', () => {
    segBtns.forEach(x => x.setAttribute('aria-selected', x === b)); noBalloon = i === 1;
    $('#sl-bal').hidden = noBalloon; if (!noBalloon) sBal.value = Math.round(balBefore/5); upd();
  }));
  function upd(){
    terms.depositPct = +sDep.value * 5;
    terms.termMonths = terms.termOptions[+sTerm.value];
    terms.balloonPct = noBalloon ? 0 : +sBal.value * 5;
    const f = calc(v.price, terms);
    $('#o-dep').textContent = `${terms.depositPct}% · ${R(f.deposit)}`;
    $('#o-term').textContent = `${terms.termMonths} months`;
    $('#o-bal').textContent = `${terms.balloonPct}% · ${R(f.balloon)}`;
    bd.innerHTML = [
      ['Monthly payment', R(f.monthly, true), 'tot'],
      ['Purchase price', R(v.price)],
      ['Deposit', R(f.deposit)],
      ['Initiation fee (financed)', R(terms.initiationFee, true)],
      ['Amount financed', R(f.principal, true)],
      ['Balloon payment', R(f.balloon)],
      ['Term', terms.termMonths + ' months'],
      ['Interest rate (indicative)', terms.ratePct + '%'],
      ['Monthly service fee', R(terms.monthlyFee, true)],
      ['Estimated total cost', R(f.total)]
    ].map(r => `<div class="${r[2]||''}"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
    // one live price everywhere in the popup
    $$('[data-live-monthly]').forEach(e => e.textContent = R(f.monthly, true));
    $$('[data-live-tip]').forEach(e => e.dataset.tip = basisText(v, terms));
  }
  [sDep, sTerm, sBal].forEach(s => s.addEventListener('input', upd));
  upd();
}

/* sticky bar: shows once the main price scrolls away, hides at the enquiry form */
let barIO = null;
function renderBar(v){
  const m = monthlyOf(v);
  $('#vbar').innerHTML = `<div class="in">
    <div class="p"><span>${m!=null ? 'Price<sup>1</sup>' : isPOA(v) ? 'Price' : 'Purchase price'}</span><b class="num">${m!=null ? `<span data-live-monthly>${R(m,true)}</span> per month` : priceText(v)}</b></div>
    <a class="btn sec wa" href="${waLink(v)}" target="_blank" rel="noopener">${ic.wa} WhatsApp</a>
    <a class="btn wa wa-sm" href="${waLink(v)}" target="_blank" rel="noopener" aria-label="WhatsApp us" style="display:none">${ic.wa}</a>
    <button class="btn pri" data-bar-enq>Enquire now</button>
  </div>`;
  $('[data-bar-enq]').onclick = goEnquire;
  $('#vbar').dataset.mobile = POP.mobileStickyBar;
  const fab = $('#vfab'); fab.dataset.mobile = POP.mobileStickyBar;
  fab.innerHTML = `<a class="fab-wa" href="${waLink(v)}" target="_blank" rel="noopener" aria-label="WhatsApp us about this car">${ic.wa}</a><button class="fab-enq" data-fab-enq>Enquire</button>`;
  $('[data-fab-enq]', fab).onclick = goEnquire;
  if (matchMedia('(max-width:720px)').matches) $('.vbar .wa-sm').style.display = 'flex';
}
function watchBar(){
  barIO && barIO.disconnect();
  const bar = $('#vbar'), sc = $('#vp-scroll');
  const price = $('#price-blk'), enq = $('#vs-enquire'), acts = $('.vi .acts', sc), fab = $('#vfab');
  let priceVis = true, enqVis = false;
  barIO = new IntersectionObserver(es => {
    es.forEach(e => { if (e.target === price) priceVis = e.isIntersecting; if (e.target === enq) enqVis = e.isIntersecting; });
    bar.classList.toggle('on', !priceVis && !enqVis);
  }, {root: sc, threshold: 0});
  barIO.observe(price); barIO.observe(enq);
  // pill: show only after the main buttons have scrolled up out of view; hide once the enquiry form is on screen.
  // Uses positions on every scroll frame, so a fast flick past the buttons can't be missed.
  let tick = false;
  const pill = () => {
    tick = false; if (!acts || !enq) return;
    const box = sc.getBoundingClientRect(), a = acts.getBoundingClientRect(), f = enq.getBoundingClientRect();
    fab.classList.toggle('on', a.bottom < box.top + 8 && f.top > box.bottom - 40);
  };
  sc.onscroll = () => { if (!tick) { tick = true; requestAnimationFrame(pill); } };
  pill();
}

/* ---------- variant B: inline expand ---------- */
function inlineHTML(v){
  const m = content(v), ks = keyStats(v, m), shown = new Set(ks.map(s => s[0] === 'Model year' ? 'Year' : s[0]));
  const facts = [['Year',v.year],['Mileage',v.condition!=='new'&&v.km!=null?grp(v.km)+' km':null],['Transmission',v.transmission],['Fuel',v.fuel],['Engine',v.engine],['Colour',v.colour],['Interior',v.interior],['Stock no.',v.stock]].filter(r => r[1] != null && r[1] !== '' && !shown.has(r[0]));
  const tabs = infoTabs(v, m);
  return `<div class="inl-box">
    <button class="x-btn inl-x" data-inl-close aria-label="Close details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="inl-gal">
      <div class="g-main" data-lb="0"><img src="${IMG(v.images[0])}" alt="${esc(v.title)}"></div>
      ${v.images.length > 1 ? `<div class="g-thumbs">${v.images.slice(1,4).map((k,i) => `<button data-lb="${i+1}" aria-label="Open photo ${i+2}"><img src="${IMG(k)}" alt=""></button>`).join('')}</div>` : ''}
    </div>
    <div class="vi inl-info">
      <h3 class="inl-t">${esc(v.title)}</h3><p class="vsub">${esc(v.sub)} · ${condLabel(v.condition)}</p>
      <div class="price-blk">${priceBlockHTML(v).replace(' data-live-tip','').replace('<span data-live-monthly>','<span>')}</div>
      ${ks.length ? `<dl class="kstats">${ks.map(s => `<div><dt>${esc(s[0])}</dt><dd class="num">${esc(s[1])}</dd></div>`).join('')}</dl>` : ''}
      ${facts.length ? `<dl class="kgrid">${facts.map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>` : ''}
      ${tabs.length ? `<div class="rows">${tabs.map(t => `<button data-spec="${t.key}">${esc(t.label)} ${ic.chev}</button>`).join('')}</div>` : ''}
      <div class="acts">
        <button class="btn pri" data-form="enquire">Enquire now</button>
        <div class="two"><button class="btn sm" data-form="testdrive">Book a test drive</button><button class="btn sm" data-form="finance">Apply for finance</button></div>
        <div class="two"><button class="btn sm" data-form="tradein">Value my trade-in</button><a class="btn sm wa" href="${waLink(v)}" target="_blank" rel="noopener">${ic.wa} WhatsApp</a></div>
        <button class="link inl-full" data-full="${v.id}">See full details, finance calculator and more →</button>
      </div>
    </div>
  </div>`;
}
function openInline(sec, id){
  const wrap = $('.inl', sec), clip = $('.inl-clip', wrap), v = V[id];
  const already = wrap.classList.contains('open') && wrap.dataset.id === id;
  $$('.card.is-open', sec).forEach(c => c.classList.remove('is-open'));
  if (already) { closeInline(sec); return; }
  cur = v; terms = termsFor(v);
  clip.innerHTML = inlineHTML(v); wrap.dataset.id = id;
  $$('.card[data-id="' + id + '"]', sec).forEach(c => c.classList.add('is-open'));
  requestAnimationFrame(() => wrap.classList.add('open'));
  const m = content(v);
  $$('[data-lb]', clip).forEach(b => b.addEventListener('click', () => { cur = v; openLB(+b.dataset.lb); }));
  $$('[data-spec]', clip).forEach(b => b.addEventListener('click', () => openSpecs(v, m, b.dataset.spec)));
  $$('[data-form]', clip).forEach(b => b.addEventListener('click', () => { cur = v; openFormDrawer(b.dataset.form, v); }));
  $('[data-full]', clip).addEventListener('click', () => openVehicle(id, false, 'page'));
  $('[data-inl-close]', clip).addEventListener('click', () => closeInline(sec));
  setTimeout(() => { const r = wrap.getBoundingClientRect(); if (r.top < 60 || r.top > innerHeight * .55) wrap.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'}); }, 120);
}
function closeInline(sec){
  const wrap = $('.inl', sec); wrap.classList.remove('open'); delete wrap.dataset.id;
  $$('.card.is-open', sec).forEach(c => c.classList.remove('is-open'));
  setTimeout(() => { if (!wrap.classList.contains('open')) $('.inl-clip', wrap).innerHTML = ''; }, 460);
}

/* ---------- drawers ---------- */
function openDrawer(title, tabs, idx){
  $('#dr-title').textContent = title;
  const tb = $('#dr-tabs');
  tb.innerHTML = tabs.length > 1 ? tabs.map((t,i) => `<button role="tab" aria-selected="${i===idx}" data-t="${i}">${esc(t.label)}</button>`).join('') : '';
  tb.hidden = tabs.length < 2;
  const show = i => { $$('button', tb).forEach(b => b.setAttribute('aria-selected', +b.dataset.t === i)); $('#dr-body').innerHTML = tabs[i].html; $('#dr-body').scrollTop = 0; tabs[i].after && tabs[i].after(); };
  $$('button', tb).forEach(b => b.onclick = () => show(+b.dataset.t));
  show(idx);
  if (!$('#drawer').classList.contains('on')) openLayer('#drawer');
}
function closeDrawer(){ closeLayer('#drawer'); }
$('#dr-close').onclick = closeDrawer;

function openPacks(v, m, i){
  const ci = v.images[0].replace(/-[a-d]$/, '');
  const rich = m.packs.filter(p => (p.detail||[]).length);
  i = Math.max(0, rich.indexOf(m.packs[i]));
  openDrawer('Packs', rich.map(p => ({label: p.title, html:
    `<p class="dr-intro">${esc(p.intro)}</p>` + p.detail.map(d => `<div class="fcard"><img src="${IMG(String(d.img).length > 1 ? d.img : ci + '-' + d.img)}" alt=""><div><h4>${esc(d.title)}</h4><p>${esc(d.text)}</p></div></div>`).join('') +
    `<div class="fgroup"><h5>Included in ${esc(p.title)}</h5><ul>${p.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`})), i);
}
function openSpecs(v, m, key){
  const isUsed = v.condition === 'used';
  const build = {
    spec: () => `<dl class="stable">${m.specs.map(s => `<div><dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd></div>`).join('')}</dl>`,
    feat: () => Object.entries(m.features).map(([g, subs]) => `<div class="fgroup"><h4>${esc(g)}</h4>${Object.entries(subs).map(([s, items]) => `<h5>${esc(s)}</h5><ul>${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>`).join('') +
      (v.dealerNotes ? `<div class="fgroup"><h4>Dealer notes</h4><p style="font-size:14px;margin:0">${esc(v.dealerNotes)}</p></div>` : ''),
    third: () => isUsed
      ? `<dl class="stable">${(v.history||[]).map(s => `<div><dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd></div>`).join('')}</dl><p class="note">History is supplied by the dealer. Ask us for the service book and inspection report.</p>`
      : `<dl class="stable">${m.services.map(s => `<div><dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd></div>`).join('')}</dl>`
  };
  const tabs = infoTabs(v, m).map(t => ({label: t.label, key: t.key, html: build[t.key]()}));
  openDrawer(v.title, tabs, Math.max(0, tabs.findIndex(t => t.key === key)));
}
function openFormDrawer(type, v){
  const titles = {enquire:'Enquire about this vehicle', testdrive:'Book a test drive', finance:'Apply for finance', tradein:'Value my trade-in', viewing:'Book a private viewing', contact:'Send us a message'};
  openDrawer(titles[type], [{label:'', html: formHTML(type, v), after: () => $$('#dr-body form').forEach(wireForm)}], 0);
}

/* ---------- forms ---------- */
function wireForm(form){
  form.addEventListener('submit', e => {
    e.preventDefault();
    let ok = true;
    $$('.fld', form).forEach(f => f.classList.remove('bad'));
    $$('[required]', form).forEach(inp => {
      let msg = '';
      if (inp.type === 'checkbox') { const l = inp.closest('label'); l.classList.toggle('bad', !inp.checked); if (!inp.checked) ok = false; return; }
      const val = inp.value.trim();
      if (!val) msg = 'Please fill this in.';
      else if (inp.type === 'email' && !/^\S+@\S+\.\S+$/.test(val)) msg = 'Enter an email address like name@example.co.za.';
      else if (inp.type === 'tel' && !/^(\+27|0)[\s\d]{9,12}$/.test(val.replace(/[()-]/g,''))) msg = 'Enter a South African mobile number, e.g. 082 123 4567.';
      if (msg) { ok = false; const f = inp.closest('.fld'); f.classList.add('bad'); $('.err', f).textContent = msg; }
    });
    if (!ok) { const first = $('.bad input, .bad select, label.bad input', form); first && first.focus(); return; }
    form.classList.add('sending'); $('.submit', form).textContent = 'Sending…';
    setTimeout(() => {
      const type = form.dataset.type, v = form.dataset.vid ? V[form.dataset.vid] : null;
      const name = $('[name="first"]', form).value.trim();
      const thanks = {enquire:'Thanks, ' + name + '. Your enquiry is with our sales team.', testdrive:'Thanks, ' + name + '. We\'ll confirm your test drive shortly.', finance:'Thanks, ' + name + '. Our finance team will be in touch.', tradein:'Thanks, ' + name + '. We\'ll send your valuation soon.', viewing:'Thanks, ' + name + '. We\'ll confirm your viewing shortly.', contact:'Thanks, ' + name + '. We\'ll be in touch soon.'}[type];
      // Trackable success element: only exists after a confirmed submission.
      const old = document.getElementById('lead-success'); old && old.removeAttribute('id');
      form.outerHTML = `<div class="form"><div class="lead-success" id="lead-success" role="status" data-lead-type="${type}" data-vehicle="${esc(v ? v.slug : '')}" data-stock="${esc(v ? v.stock : '')}">${ic.ok}<div><b>${esc(thanks)}</b><p>We usually reply within one business hour.${v ? ' Reference: ' + esc(v.stock) : ''}</p></div></div></div>`;
      (window.dataLayer = window.dataLayer || []).push(Object.assign({event:'lead_success', lead_type:type}, v ? {vehicle:v.slug, stock:v.stock, condition:v.condition, price:v.price} : {}));
    }, 900);
  });
  $$('input,select', form).forEach(i => i.addEventListener('input', () => { const f = i.closest('.fld'); f && f.classList.remove('bad'); const l = i.closest('label'); l && l.classList.remove('bad'); }));
}

/* ---------- lightbox ---------- */
let lbi = 0, lbAng = false;
function lbRender(){
  const imgs = cur.images, angleSet = imgs.slice(0, 2);
  const set = lbAng ? angleSet : imgs;
  lbi = (lbi + set.length) % set.length;
  $('#lb-img').src = IMG(set[lbi]); $('#lb-img').alt = cur.title + ' photo ' + (lbi + 1);
  $('#lb-thumbs').innerHTML = set.map((k,i) => `<button data-i="${i}" aria-current="${i===lbi}" aria-label="Photo ${i+1}"><img src="${IMG(k)}" alt=""></button>`).join('');
  $$('#lb-thumbs button').forEach(b => b.onclick = () => { lbi = +b.dataset.i; lbRender(); });
  $('#lb-m-gal').setAttribute('aria-pressed', !lbAng); $('#lb-m-ang').setAttribute('aria-pressed', lbAng);
  $('#lb-stage').classList.toggle('angles', lbAng); $('#lb-hint').hidden = !lbAng;
}
function openLB(i, ang){ lbi = i; lbAng = !!ang; lbRender(); openLayer('#lb'); }
$('#lb-close').onclick = () => closeLayer('#lb');
$('#lb-prev').onclick = () => { lbi--; lbRender(); };
$('#lb-next').onclick = () => { lbi++; lbRender(); };
$('#lb-m-gal').onclick = () => { lbAng = false; lbi = 0; lbRender(); };
$('#lb-m-ang').onclick = () => { lbAng = true; lbi = 0; lbRender(); };
document.addEventListener('keydown', e => { if (stack[stack.length-1] !== '#lb') return; if (e.key === 'ArrowLeft') { lbi--; lbRender(); } if (e.key === 'ArrowRight') { lbi++; lbRender(); } });
(function(){ // drag/swipe on stage
  const st = $('#lb-stage'); let x0 = null, acc = 0;
  st.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; x0 = e.clientX; acc = 0; st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove', e => { if (x0 == null) return; const dx = e.clientX - x0; const step = lbAng ? 60 : 9999;
    if (Math.abs(dx - acc) > step) { lbi += dx - acc > 0 ? -1 : 1; acc = dx; lbRender(); } });
  st.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; if (!lbAng && Math.abs(dx) > 50) { lbi += dx > 0 ? -1 : 1; lbRender(); } x0 = null; });
})();

/* ---------- deep links ---------- */
function fromHash(){
  const h = location.hash.slice(1);
  if (h.startsWith('v-')) { const v = DATA.vehicles.find(x => x.slug === h.slice(2)); if (v) openVehicle(v.id, true); }
}
addEventListener('hashchange', fromHash);
fromHash();

/* ---------- structured data for search & AI ---------- */

  "makesOffer": DATA.vehicles.map(v => ({ "@type":"Offer", ...(isPOA(v) ? {} : {"price":v.price}), "priceCurrency":"ZAR", "availability":"https://schema.org/InStock",

      "itemCondition": v.condition === 'used' ? "https://schema.org/UsedCondition" : "https://schema.org/NewCondition",
      "mileageFromOdometer": {"@type":"QuantitativeValue","value":v.km||0,"unitCode":"KMT"}, "color":v.colour, "vehicleTransmission":v.transmission, "fuelType":v.fuel, "sku":v.stock, "image":IMG(v.images[0]) } })) };

/* the floating WhatsApp button steps aside while a layer is open */
new MutationObserver(() => { const f = $('#wa-float'); if (f) f.classList.toggle('away', document.documentElement.style.overflow === 'hidden' || $('#ctray').classList.contains('on')); }).observe(document.documentElement, {attributes:true, attributeFilter:['style']});

/* ---------- hooks for the built-in editor (not used by visitors) ---------- */
window.CASite = { prelaunchCheck, calc, R, grp, parseExtras, PLACEHOLDERS,
  openVehicle: id => openVehicle(id, true), current: () => cur && cur.id, closeVehicle };
if (window.CAEditor && !window.__CA_PREVIEW) window.CAEditor.boot();
})();
